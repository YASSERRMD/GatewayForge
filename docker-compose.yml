name: gatewayforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatewayforge}
      POSTGRES_USER: ${POSTGRES_USER:-gatewayforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatewayforge_local_dev_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - gatewayforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatewayforge} -d ${POSTGRES_DB:-gatewayforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gatewayforge-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-gatewayforge_local_redis_pw}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gatewayforge_local_redis_pw} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  mock-upstream:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mock-upstream
    restart: unless-stopped
    environment:
      MOCK_UPSTREAM_ADDR: ":8089"
      MOCK_UPSTREAM_INSTANCE: "mock-upstream-1"
    ports:
      - "127.0.0.1:${MOCK_UPSTREAM_PORT:-18089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  control-plane:
    build:
      context: .
      dockerfile: deploy/Dockerfile.control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAYFORGE_ENV: ${GATEWAYFORGE_ENV:-development}
      CONTROL_PLANE_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-gatewayforge}:${POSTGRES_PASSWORD:-gatewayforge_local_dev_pw}@postgres:5432/${POSTGRES_DB:-gatewayforge}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gatewayforge_local_redis_pw}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-32chars-minimum}
      GATEWAY_SYNC_TOKEN: ${GATEWAY_SYNC_TOKEN:-dev-only-gateway-sync-token-123456}
      ALLOW_MOCK_UPSTREAMS: ${ALLOW_MOCK_UPSTREAMS:-true}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAYFORGE_ENV: ${GATEWAYFORGE_ENV:-development}
      GATEWAY_INSTANCE_ID: "gateway-1"
      GATEWAY_ADDR: ":8081"
      CONTROL_PLANE_URL: http://control-plane:8080
      GATEWAY_SYNC_TOKEN: ${GATEWAY_SYNC_TOKEN:-dev-only-gateway-sync-token-123456}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gatewayforge_local_redis_pw}
      ALLOW_MOCK_UPSTREAMS: ${ALLOW_MOCK_UPSTREAMS:-true}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  gateway-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAYFORGE_ENV: ${GATEWAYFORGE_ENV:-development}
      GATEWAY_INSTANCE_ID: "gateway-2"
      GATEWAY_ADDR: ":8081"
      CONTROL_PLANE_URL: http://control-plane:8080
      GATEWAY_SYNC_TOKEN: ${GATEWAY_SYNC_TOKEN:-dev-only-gateway-sync-token-123456}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gatewayforge_local_redis_pw}
      ALLOW_MOCK_UPSTREAMS: ${ALLOW_MOCK_UPSTREAMS:-true}
    ports:
      - "127.0.0.1:${GATEWAY_2_PORT:-18082}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:${CONTROL_PLANE_PORT:-18080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gatewayforge-internal

volumes:
  gatewayforge_pgdata:

networks:
  gatewayforge-internal:
    driver: bridge
