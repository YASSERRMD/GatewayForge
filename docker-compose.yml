name: gatewayforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatewayforge}
      POSTGRES_USER: ${POSTGRES_USER:-gatewayforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatewayforge_local_dev_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - gatewayforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatewayforge} -d ${POSTGRES_DB:-gatewayforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gatewayforge-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-gatewayforge_local_redis_pw}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gatewayforge_local_redis_pw} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

  mock-upstream:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mock-upstream
    restart: unless-stopped
    environment:
      MOCK_UPSTREAM_ADDR: ":8089"
      MOCK_UPSTREAM_INSTANCE: "mock-upstream-1"
    ports:
      - "127.0.0.1:${MOCK_UPSTREAM_PORT:-18089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - gatewayforge-internal

volumes:
  gatewayforge_pgdata:

networks:
  gatewayforge-internal:
    driver: bridge
