openapi: 3.1.0
info:
  title: GatewayForge Control Plane API
  version: 1.0.0
  description: |
    Self-hosted multi-tenant API gateway control plane contract.
    All tenant-scoped endpoints live under `/api/v1/orgs/{orgId}` and enforce explicit membership, RBAC, and CSRF protection on state-changing requests.
    Gateway data-plane sync uses `/api/v1/gateway/snapshots/active` authenticated via `Authorization: Bearer <GATEWAY_SYNC_TOKEN>` with ETag conditional caching.
servers:
  - url: http://127.0.0.1:18080
    description: Local Docker Compose control plane
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gwf_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    gatewaySyncBearer:
      type: http
      scheme: bearer
      description: Shared data-plane sync token (`GATEWAY_SYNC_TOKEN`), supports comma-separated overlap during rotation.
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, enum: [ok, ready, not_ready, draining] }
        service: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, slug, display_name, enabled, revision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        enabled: { type: boolean }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemberView:
      type: object
      required: [membership_id, user_id, email, display_name, role]
      properties:
        membership_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        is_active: { type: boolean }
    Service:
      type: object
      required: [id, org_id, env_id, slug, name, enabled, revision]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        env_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        revision: { type: integer }
    UpstreamPool:
      type: object
      required: [id, org_id, env_id, name, destination_class, revision]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        env_id: { type: string, format: uuid }
        name: { type: string }
        destination_class: { type: string, enum: [public_http, mock_local, internal_explicit] }
        connect_timeout_ms: { type: integer }
        read_timeout_ms: { type: integer }
        health_check_path: { type: string }
        revision: { type: integer }
    Route:
      type: object
      required: [id, org_id, env_id, service_id, upstream_pool_id, name, host, path_prefix, methods, priority, enabled, revision]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        env_id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        upstream_pool_id: { type: string, format: uuid }
        name: { type: string }
        host: { type: string }
        path_prefix: { type: string }
        methods:
          type: array
          items: { type: string }
        strip_prefix: { type: boolean }
        priority: { type: integer }
        enabled: { type: boolean }
        revision: { type: integer }
    Consumer:
      type: object
      required: [id, org_id, name, enabled, revision]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        external_ref: { type: string }
        enabled: { type: boolean }
        revision: { type: integer }
    Policy:
      type: object
      required: [id, org_id, name, policy_type, schema_version, config, enabled, revision]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        policy_type: { type: string, enum: [auth, rate_limit, timeout, retry, circuit_breaker, cors] }
        schema_version: { type: integer }
        config: { type: object }
        enabled: { type: boolean }
        revision: { type: integer }
    Publication:
      type: object
      required: [id, org_id, version, checksum, status]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        version: { type: integer }
        checksum: { type: string }
        status: { type: string, enum: [published, active, superseded, rolled_back] }
        change_note: { type: string }
        created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, target_type, request_id, created_at]
      properties:
        id: { type: integer }
        org_id: { type: string, format: uuid }
        actor_email: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        request_id: { type: string }
        before_redacted: { type: object }
        after_redacted: { type: object }
        created_at: { type: string, format: date-time }
paths:
  /health/live:
    get:
      summary: Control-plane liveness probe
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      summary: Control-plane liveness probe (HEAD)
      responses:
        "200":
          description: Process is live
  /health/ready:
    get:
      summary: Control-plane readiness probe
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Dependency unavailable or draining
    head:
      summary: Control-plane readiness probe (HEAD)
      responses:
        "200":
          description: Service and dependencies are ready
        "503":
          description: Dependency unavailable or draining
  /api/v1/meta:
    get:
      summary: Control-plane API metadata
      responses:
        "200":
          description: API version and correlation ID
  /api/v1/auth/bootstrap:
    post:
      summary: One-time dev/test initial administrator provisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password, org_slug, org_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                password: { type: string, minLength: 12 }
                org_slug: { type: string }
                org_name: { type: string }
      responses:
        "201": { description: Initial owner and organization provisioned }
        "403": { description: Disabled in production }
        "409": { description: Already bootstrapped }
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Session cookie and CSRF token issued }
        "401": { description: Invalid credentials }
  /api/v1/auth/logout:
    post:
      summary: Revoke current session server-side
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Session revoked }
        "401": { description: Unauthenticated }
        "403": { description: Invalid CSRF token }
  /api/v1/auth/me:
    get:
      summary: Current authenticated user profile and organization memberships
      security:
        - sessionCookie: []
      responses:
        "200": { description: User profile and explicit memberships }
        "401": { description: Unauthenticated }
  /api/v1/orgs:
    get:
      summary: List organizations accessible to the current user
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated organizations list }
    post:
      summary: Create a new organization with caller as owner
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /api/v1/orgs/{orgId}:
    get:
      summary: Get organization details
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Organization object with revision ETag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      summary: Update organization settings with optimistic concurrency
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Organization updated }
        "409": { description: Stale revision conflict }
  /api/v1/orgs/{orgId}/members:
    get:
      summary: List organization members
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated members list }
    post:
      summary: Add or invite member to organization
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: Membership created }
        "403": { description: Insufficient permissions or owner grant forbidden }
  /api/v1/orgs/{orgId}/members/{userId}:
    patch:
      summary: Change member role with last-owner protection
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Role updated }
        "409": { description: Last owner cannot be demoted }
    delete:
      summary: Revoke organization membership with last-owner protection
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Membership revoked }
        "409": { description: Last owner cannot be removed }
  /api/v1/orgs/{orgId}/environments:
    get:
      summary: List tenant deployment environments
      security:
        - sessionCookie: []
      responses:
        "200": { description: Environments for the organization }
  /api/v1/orgs/{orgId}/services:
    get:
      summary: List logical services in organization
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated services list }
    post:
      summary: Create a logical service
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /api/v1/orgs/{orgId}/services/{serviceId}:
    get:
      summary: Get service detail
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Service object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    patch:
      summary: Update service with optimistic concurrency
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Service updated }
        "409": { description: Stale revision conflict }
    delete:
      summary: Soft-delete service
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Service deleted }
  /api/v1/orgs/{orgId}/upstreams:
    get:
      summary: List upstream pools and targets
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated upstream pools }
    post:
      summary: Create an upstream pool with SSRF-validated destination class
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Upstream pool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamPool"
  /api/v1/orgs/{orgId}/upstreams/health:
    get:
      summary: Inspect upstream pool health diagnostics
      security:
        - sessionCookie: []
      responses:
        "200": { description: Upstream health check status }
  /api/v1/orgs/{orgId}/upstreams/{poolId}:
    get:
      summary: Get upstream pool detail and targets
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Upstream pool object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamPool"
    patch:
      summary: Update upstream pool settings
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Upstream pool updated }
        "409": { description: Stale revision conflict }
    delete:
      summary: Delete upstream pool
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Upstream pool deleted }
  /api/v1/orgs/{orgId}/upstreams/{poolId}/targets:
    post:
      summary: Add an SSRF-validated target URL to an upstream pool
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: Target added }
        "422": { description: Target URL blocked by SSRF or validation policy }
  /api/v1/orgs/{orgId}/upstreams/{poolId}/targets/{targetId}:
    delete:
      summary: Remove a target from an upstream pool
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Target deleted }
  /api/v1/orgs/{orgId}/routes:
    get:
      summary: List configured routes
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated routes list }
    post:
      summary: Create a route binding host, path prefix, methods, service, and upstream pool
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
  /api/v1/orgs/{orgId}/routes/preview:
    get:
      summary: Preview deterministic route matching precedence order
      security:
        - sessionCookie: []
      responses:
        "200": { description: Ordered route match table }
  /api/v1/orgs/{orgId}/routes/{routeId}:
    get:
      summary: Get route detail
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Route object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
    patch:
      summary: Update route with optimistic concurrency
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Route updated }
        "409": { description: Stale revision conflict }
    delete:
      summary: Delete route
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Route deleted }
  /api/v1/orgs/{orgId}/consumers:
    get:
      summary: List API consumers
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated consumers list }
    post:
      summary: Create an API consumer
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Consumer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
  /api/v1/orgs/{orgId}/consumers/{consumerId}:
    get:
      summary: Get consumer detail
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Consumer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
    patch:
      summary: Update consumer
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Consumer updated }
    delete:
      summary: Delete consumer
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Consumer deleted }
  /api/v1/orgs/{orgId}/consumers/{consumerId}/keys:
    get:
      summary: List non-secret API key metadata for consumer
      security:
        - sessionCookie: []
      responses:
        "200": { description: API key prefixes and status (never plaintext secrets) }
    post:
      summary: Issue a new API key (plaintext secret returned once in response only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: API key issued with one-time plaintext secret }
  /api/v1/orgs/{orgId}/keys/{keyId}/revoke:
    post:
      summary: Immediately revoke an API key and notify gateways
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Key revoked }
  /api/v1/orgs/{orgId}/keys/{keyId}/rotate:
    post:
      summary: Rotate an API key with optional grace overlap window
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: Replacement API key issued }
  /api/v1/orgs/{orgId}/policies:
    get:
      summary: List policies and attachments
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated policies list }
    post:
      summary: Create a validated policy (auth, rate_limit, timeout, retry, circuit_breaker, cors)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
  /api/v1/orgs/{orgId}/policies/{policyId}:
    get:
      summary: Get policy detail and attachments
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Policy object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
    patch:
      summary: Update policy configuration
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Policy updated }
    delete:
      summary: Delete policy
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Policy deleted }
  /api/v1/orgs/{orgId}/policies/{policyId}/attachments:
    post:
      summary: Attach policy to a service, route, or consumer
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: Policy attached }
  /api/v1/orgs/{orgId}/policies/{policyId}/attachments/{attachmentId}:
    delete:
      summary: Detach policy from target
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { description: Policy detached }
  /api/v1/orgs/{orgId}/draft:
    get:
      summary: Load current draft snapshot preview and validation report
      security:
        - sessionCookie: []
      responses:
        "200": { description: Draft revision, validation report, and compiled preview }
  /api/v1/orgs/{orgId}/draft/diff:
    get:
      summary: Compare current draft against the currently active publication (redacted)
      security:
        - sessionCookie: []
      responses:
        "200": { description: Structured diff summary without secret hashes }
  /api/v1/orgs/{orgId}/draft/validate:
    post:
      summary: Run strict pre-publish validation on current draft
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Validation result with actionable field errors }
  /api/v1/orgs/{orgId}/publications:
    get:
      summary: List immutable config publications and active version
      security:
        - sessionCookie: []
      responses:
        "200": { description: Ordered publication history }
    post:
      summary: Compile, validate, and publish an immutable versioned snapshot
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201":
          description: Immutable publication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "409": { description: Stale draft revision conflict }
        "422": { description: Draft validation failed }
  /api/v1/orgs/{orgId}/publications/{version}/activate:
    post:
      summary: Activate or roll back to a specific immutable publication version
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Publication activated and Redis config hint emitted }
        "409": { description: Optimistic concurrency mismatch }
  /api/v1/orgs/{orgId}/console/execute:
    post:
      summary: Execute an API test request strictly anchored to the configured GatewayForge data plane
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Proxied gateway response status, headers, latency, and bounded body }
        "422": { description: Invalid method or disallowed target path }
  /api/v1/orgs/{orgId}/openapi/preview:
    post:
      summary: Parse OpenAPI 3.0/3.1 JSON or YAML (rejecting external $ref) and preview route collision plan
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200": { description: Parsed candidates and collision detection report }
  /api/v1/orgs/{orgId}/openapi/import:
    post:
      summary: Transactionally import selected OpenAPI routes into the organization draft
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "201": { description: Selected services/routes imported into draft }
  /api/v1/orgs/{orgId}/openapi/export:
    get:
      summary: Export organization services and routes as an OpenAPI 3.0.3 document
      security:
        - sessionCookie: []
      responses:
        "200": { description: Generated OpenAPI 3.0.3 JSON document }
  /api/v1/orgs/{orgId}/gateways:
    get:
      summary: List active gateway replicas, converged config checksums, and heartbeat freshness
      security:
        - sessionCookie: []
      responses:
        "200": { description: Gateway fleet convergence status }
  /api/v1/orgs/{orgId}/metrics/summary:
    get:
      summary: Query aggregated traffic KPIs (RPS, error rate, p95 latency)
      security:
        - sessionCookie: []
      responses:
        "200": { description: Summary telemetry metrics }
  /api/v1/orgs/{orgId}/metrics/timeseries:
    get:
      summary: Query time-bucketed request volume and latency series
      security:
        - sessionCookie: []
      responses:
        "200": { description: Time-series metric buckets }
  /api/v1/orgs/{orgId}/metrics/errors:
    get:
      summary: Query top erroring routes and status breakdown
      security:
        - sessionCookie: []
      responses:
        "200": { description: Error breakdown metrics }
  /api/v1/orgs/{orgId}/telemetry/traces/{requestId}:
    get:
      summary: Look up trace correlation metadata and optional Jaeger link for a request ID
      security:
        - sessionCookie: []
      responses:
        "200": { description: Correlated trace ID and viewer link }
        "404": { description: No trace recorded for request ID }
  /api/v1/orgs/{orgId}/audit-events:
    get:
      summary: List append-only redacted audit events with filters
      security:
        - sessionCookie: []
      responses:
        "200": { description: Paginated audit events }
  /api/v1/orgs/{orgId}/audit-events/{eventId}:
    get:
      summary: Get single immutable audit event detail
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Audit event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
  /api/v1/gateway/snapshots/active:
    get:
      summary: Fetch the compiled active snapshot for gateway data-plane synchronization
      security:
        - gatewaySyncBearer: []
      responses:
        "200": { description: Full signed/checksummed snapshot payload with ETag }
        "304": { description: Gateway already holds latest active snapshot checksum }
        "401": { description: Invalid or missing gateway sync bearer token }
